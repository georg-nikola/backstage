app:
  baseUrl: https://backstage.georg-nikola.com

backend:
  baseUrl: https://backstage.georg-nikola.com
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: https://backstage.georg-nikola.com
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}   # ponytail: classic PAT; GitHub App when rate limit or rotation bites

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Domain]
  providers:
    github:
      georg-nikola:
        organization: georg-nikola
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
  locations:
    - type: url
      target: https://github.com/georg-nikola/talos-configs/blob/main/local-cluster-config/manifests/backstage/catalog/all.yaml

auth:
  environment: production
  providers:
    oidc:
      production:
        metadataUrl: https://auth.georg-nikola.com/application/o/backstage/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: home-talos
          url: https://kubernetes.default.svc
          authProvider: serviceAccount   # uses the pod's mounted SA token
          skipTLSVerify: false
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: home
          url: http://argocd-server.argocd.svc   # server.insecure=true behind Traefik
          token: ${ARGOCD_AUTH_TOKEN}

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local   # ponytail: pod FS, rebuilt after restart; PVC or S3 if that gets slow
